name: V2 Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent-v2-audit]

permissions:
  contents: read

jobs:
  opportunity-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic opportunity engine tests
        run: python -m unittest -v test_dominant_agent.py

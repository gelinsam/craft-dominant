name: Campaign draft recovery
on:
  pull_request:
    branches: [main]
jobs:
  draft-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-workflows.txt
      - run: python -m unittest test_crm_audience test_campaign_preparation test_campaign_workflow_runtime -v
